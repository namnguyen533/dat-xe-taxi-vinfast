<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập Quản Trị Viên - TaxiVinFast Admin</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="admin-login-body">
    <div class="admin-login-wrapper">
      <div class="admin-login-card">
        
        <!-- Header Brand -->
        <div class="login-brand">
          <div class="brand-icon">⚡</div>
          <h2>TaxiVinFast Admin</h2>
          <p>Hệ Thống Quản Trị Đội Xe Taxi Điện VinFast</p>
        </div>

        <!-- Login Form -->
        <form id="admin-login-form" class="login-form">
          <div id="login-error-msg" class="login-error-alert" style="display: none;"></div>

          <div class="form-group">
            <label for="admin-username" class="form-label">Tên đăng nhập / Email Admin</label>
            <div class="input-with-icon">
              <span class="input-icon">👤</span>
              <input type="text" id="admin-username" class="form-input" placeholder="Nhập admin hoặc email..." value="admin" required />
            </div>
          </div>

          <div class="form-group">
            <label for="admin-password" class="form-label">Mật khẩu</label>
            <div class="input-with-icon">
              <span class="input-icon">🔒</span>
              <input type="password" id="admin-password" class="form-input" placeholder="Nhập mật khẩu..." value="123456" required />
              <button type="button" id="btn-toggle-pwd" class="btn-pwd-toggle" title="Hiện/Ẩn mật khẩu">👁️</button>
            </div>
          </div>

          <div class="login-options">
            <label class="remember-me">
              <input type="checkbox" id="remember-admin" checked />
              <span>Ghi nhớ đăng nhập</span>
            </label>
            <a href="#" class="forgot-link" onclick="alert('Vui lòng liên hệ Quản trị viên hệ thống để khôi phục mật khẩu!'); return false;">Quên mật khẩu?</a>
          </div>

          <button type="submit" id="btn-admin-submit" class="btn-login-submit">
            🔐 Đăng Nhập Quản Trị
          </button>
        </form>

        <div class="demo-credentials-box">
          <span class="demo-title">💡 Tài khoản Admin thử nghiệm:</span>
          <div class="credentials-info">
            <span>Tài khoản: <strong>admin</strong></span>
            <span>Mật khẩu: <strong>123456</strong></span>
          </div>
        </div>

        <div class="login-footer-link">
          <a href="index.html">← Quay lại trang chủ TaxiVinFast</a>
        </div>

      </div>
    </div>

    <script type="module" src="/src/admin-login.js"></script>
  </body>
</html>
