<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập tài xế - TaxiVinFast</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      .driver-auth-section { min-height: calc(100vh - 150px); display: grid; place-items: center; padding: 40px 20px; background: linear-gradient(140deg, #f2f8f7, #fff8f3); }
      .driver-auth-card { width: min(100%, 440px); padding: 34px; border: 1px solid #e4eceb; border-radius: 18px; background: #fff; box-shadow: 0 18px 55px rgba(30, 66, 76, .1); }
      .driver-auth-mark { display: grid; width: 58px; height: 58px; place-items: center; margin: 0 auto 14px; border-radius: 18px; color: #fff; background: linear-gradient(145deg, #294f5d, #e76b3e); font-size: 27px; }
      .driver-auth-heading { text-align: center; }
      .driver-auth-heading h2 { margin: 0 0 7px; color: #203d4c; font-size: 26px; }
      .driver-auth-heading p { margin: 0 0 24px; color: #82919b; font-size: 13px; }
      .driver-auth-form { display: grid; gap: 15px; }
      .driver-auth-form label { display: grid; gap: 7px; color: #526775; font-size: 12px; font-weight: 700; }
      .driver-auth-form input { min-height: 44px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #dfe7ea; border-radius: 9px; color: #344c59; background: #fff; font: 14px var(--sans); }
      .driver-auth-form input:focus { border-color: #83aeba; outline: 3px solid rgba(71, 133, 148, .12); }
      .driver-auth-submit { min-height: 45px; margin-top: 4px; border: 0; border-radius: 9px; color: #fff; background: #e76b3e; cursor: pointer; font: 700 14px var(--sans); }
      .driver-auth-submit:disabled { cursor: wait; opacity: .65; }
      .driver-auth-error { min-height: 18px; color: #ae4735; font-size: 12px; text-align: center; }
      .driver-auth-demo { margin-top: 17px; padding: 12px 14px; border: 1px solid #e4eceb; border-radius: 10px; color: #768690; background: #f7faf9; font-size: 11px; line-height: 1.7; }
      .driver-auth-demo strong { color: #385466; }
      .driver-auth-links { display: grid; gap: 12px; margin-top: 20px; text-align: center; font-size: 12px; }
      .driver-auth-links a { color: #d86139; font-weight: 700; text-decoration: none; }
      @media (max-width: 520px) { .driver-auth-card { padding: 26px 20px; } }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <div class="logo"><a href="index.html"><h1>TaxiVinFast</h1></a></div>
        <div class="header-actions"><a class="driver-entry-link" href="dangnhap.html">Đăng nhập khách hàng</a></div>
      </div>
    </header>
    <main>
      <section class="driver-auth-section">
        <div class="driver-auth-card">
          <div class="driver-auth-mark" aria-hidden="true">🚘</div>
          <div class="driver-auth-heading"><h2>Đăng nhập tài xế</h2><p>Khu vực riêng dành cho đối tác tài xế TaxiVinFast</p></div>
          <form id="driver-login-form" class="driver-auth-form" novalidate>
            <label>Email tài xế<input id="driver-login-email" type="email" autocomplete="username" required /></label>
            <label>Mật khẩu<input id="driver-login-password" type="password" autocomplete="current-password" required /></label>
            <div id="driver-login-error" class="driver-auth-error" role="alert" aria-live="polite"></div>
            <button class="driver-auth-submit" type="submit">Đăng nhập khu vực tài xế</button>
          </form>
          <div class="driver-auth-demo"><strong>Tài khoản demo tài xế</strong><br />Email: <strong>driver@taxivinfast.com</strong><br />Mật khẩu: <strong>123456</strong></div>
          <div class="driver-auth-links"><a href="dangnhap.html">Đăng nhập hoặc đặt xe với tư cách khách hàng</a><a href="index.html">← Quay lại trang chủ</a></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/driver-login.js"></script>
  </body>
</html>
